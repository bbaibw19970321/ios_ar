name: Build iOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter doctor
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Accept Xcode license
        run: |
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      # 🪡 缝旧内芯（保留！）
      - name: Patch camera Swift for new Xcode
        run: |
          find "$HOME/.pub-cache" -name DefaultCamera.swift -path "*camera_avfoundation*" -print -exec sed -i '' \
            -e 's/AVCaptureSession\.wasInterruptedNotification/NSNotification.Name.AVCaptureSessionWasInterrupted/g' \
            -e 's/AVCaptureSession\.runtimeErrorNotification/NSNotification.Name.AVCaptureSessionRuntimeError/g' {} +

      # 🔓 关闭签名要求（新增！就这一步）
      - name: Disable code signing
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_REQUIRED = [^;]*;/CODE_SIGNING_REQUIRED = NO;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGNING_ALLOWED = [^;]*;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          echo "✅ Code signing disabled in $PBXPROJ"

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # 📦 打包 ipa
      - name: Package unsigned ipa
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -RL Runner.app Payload/
          zip -qr Runner.ipa Payload
          echo "----- ipa size -----"
          ls -lh Runner.ipa
          echo "----- ipa contents (top) -----"
          unzip -l Runner.ipa | head -25

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.ipa