name: Build iOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Flutter doctor
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Accept Xcode license
        run: |
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Get dependencies
        run: flutter pub get

      # 🪡 缝旧内芯（保留！）
      - name: Patch camera Swift for new Xcode
        run: |
          find "$HOME/.pub-cache" -name DefaultCamera.swift -path "*camera_avfoundation*" -print -exec sed -i '' \
            -e 's/AVCaptureSession\.wasInterruptedNotification/NSNotification.Name.AVCaptureSessionWasInterrupted/g' \
            -e 's/AVCaptureSession\.runtimeErrorNotification/NSNotification.Name.AVCaptureSessionRuntimeError/g' {} +

      # ★★★ 新增：把 YoloDetectPlugin.swift 和 best.mlpackage 注册进 Xcode 工程 ★★★
      # ★★★ 编译模型 + 注册文件 ★★★
      - name: Compile ML model and register in Xcode
        run: |
          # 1) 把 .mlpackage 编译成 .mlmodelc
          xcrun coremlcompiler compile ios/Runner/best.mlpackage ios/Runner/
          echo "===== mlmodelc 编译结果 ====="
          ls -la ios/Runner/best.mlmodelc/ || echo "❌ mlmodelc 不存在"

          # 2) 注册到 Xcode 工程
          cd ios
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"

            project = Xcodeproj::Project.open("Runner.xcodeproj")
            target = project.targets.find { |t| t.name == "Runner" }
            runner_group = project.main_group.find_subpath("Runner", false)

            # 添加 YoloDetectPlugin.swift
            unless target.source_build_phase.files.any? { |f| f.file_ref&.path&.include?("YoloDetectPlugin") }
              ref = runner_group.new_reference("YoloDetectPlugin.swift")
              ref.last_known_file_type = "sourcecode.swift"
              target.source_build_phase.add_file_reference(ref)
              puts "✅ YoloDetectPlugin.swift → Compile Sources"
            end

            # 添加 best.mlmodelc（编译后的模型）到资源
            unless target.resources_build_phase.files.any? { |f| f.file_ref&.path&.include?("best.mlmodelc") }
              ref = runner_group.new_reference("best.mlmodelc")
              ref.last_known_file_type = "folder"
              target.resources_build_phase.add_file_reference(ref)
              puts "✅ best.mlmodelc → Bundle Resources"
            end

            project.save
            puts "✅ project.pbxproj saved"
          '
          cd ..

      # 🔓 骗过 Flutter 的 Team 检查
      - name: Disable code signing
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
          sed -i '' '/PROVISIONING_PROFILE/d' "$PBXPROJ"
          sed -i '' 's/buildSettings = {/buildSettings = {\
          				DEVELOPMENT_TEAM = XXXXXXXXXX;\
          				CODE_SIGNING_ALLOWED = NO;\
          				CODE_SIGNING_REQUIRED = NO;\
          				CODE_SIGN_IDENTITY = "";\
          				CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          echo "===== verify ====="
          grep -c "DEVELOPMENT_TEAM = XXXXXXXXXX" "$PBXPROJ"
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ"

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # 📦 打包 ipa
      - name: Package unsigned ipa
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -RL Runner.app Payload/
          zip -qr Runner.ipa Payload
          echo "----- ipa size -----"
          ls -lh Runner.ipa
          echo "----- ipa contents (top) -----"
          unzip -l Runner.ipa | head -25

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.ipa